<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Código da Confiabilidade — Plataforma</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── BACKGROUND SUTIL ── */
  .bg {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(13,45,82,0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(13,45,82,0.03) 0%, transparent 50%),
      #ffffff;
    z-index: 0;
  }

  /* ── CARD ── */
  .card {
    position: relative;
    z-index: 1;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    box-shadow:
      0 4px 6px rgba(0,0,0,0.04),
      0 20px 60px rgba(13,45,82,0.08);
    width: 100%;
    max-width: 440px;
    margin: 24px;
    overflow: hidden;
  }

  /* ── IMAGEM TOPO ── */
  .card-cover {
    width: 100%;
    height: 200px;
    overflow: hidden;
    position: relative;
  }

  .card-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 15%;
    display: block;
  }

  .card-cover-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(13,45,82,0.1) 0%,
      rgba(13,45,82,0.55) 100%
    );
  }

  .card-cover-text {
    position: absolute;
    bottom: 18px;
    left: 22px;
    right: 22px;
  }

  .card-cover-text h1 {
    font-size: 1rem;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.3px;
    line-height: 1.3;
  }

  .card-cover-text p {
    font-size: 0.72rem;
    color: rgba(255,255,255,0.75);
    margin-top: 3px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* ── BODY DO CARD ── */
  .card-body {
    padding: 32px 36px 36px;
  }

  .section-title {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #94a3b8;
    margin-bottom: 22px;
    text-align: center;
  }

  /* ── FIELDS ── */
  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    color: #475569;
    margin-bottom: 7px;
    letter-spacing: 0.3px;
  }

  .field input {
    width: 100%;
    border: 1.5px solid #e2e8f0;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.9rem;
    color: #1e293b;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: #f8fafc;
  }

  .field input::placeholder { color: #cbd5e1; }

  .field input:focus {
    outline: none;
    border-color: #0d2d52;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(13,45,82,0.07);
  }

  /* ── BUTTON ── */
  .btn-primary {
    width: 100%;
    padding: 13px;
    background: #0d2d52;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s, transform 0.1s;
    margin-top: 6px;
  }

  .btn-primary:hover { background: #0a2340; }
  .btn-primary:active { transform: scale(0.99); }

  /* ── DIVIDER ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0;
  }

  .divider-line {
    flex: 1;
    height: 1px;
    background: #e2e8f0;
  }

  .divider-text {
    font-size: 0.72rem;
    color: #94a3b8;
    white-space: nowrap;
    font-weight: 500;
  }

  /* ── SOLICITAR ACESSO ── */
  .btn-request {
    width: 100%;
    padding: 12px;
    background: #ffffff;
    color: #0d2d52;
    border: 1.5px solid #0d2d52;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s, color 0.2s;
    letter-spacing: 0.3px;
  }

  .btn-request:hover {
    background: #f0f5ff;
  }

  /* ── ERROR / SUCCESS ── */
  .msg {
    border-radius: 7px;
    padding: 11px 14px;
    font-size: 0.82rem;
    text-align: center;
    margin-top: 14px;
    display: none;
  }

  .msg.error {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #dc2626;
  }

  .msg.success {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    color: #16a34a;
  }

  /* ── MODAL SOLICITAR ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: #ffffff;
    border-radius: 14px;
    padding: 36px 32px;
    width: 100%;
    max-width: 380px;
    margin: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    position: relative;
  }

  .modal h3 {
    font-size: 1.05rem;
    font-weight: 700;
    color: #0d2d52;
    margin-bottom: 6px;
  }

  .modal p {
    font-size: 0.82rem;
    color: #64748b;
    margin-bottom: 22px;
    line-height: 1.5;
  }

  .modal-close {
    position: absolute;
    top: 16px; right: 18px;
    background: none;
    border: none;
    font-size: 1.3rem;
    color: #94a3b8;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }

  .modal-close:hover { color: #475569; }

  /* ── SPINNER ── */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 7px;
    vertical-align: middle;
  }

  /* ── FOOTER ── */
  .card-footer {
    text-align: center;
    padding: 0 36px 24px;
    font-size: 0.68rem;
    color: #cbd5e1;
    letter-spacing: 0.3px;
  }

  @media(max-width:480px) {
    .card-body { padding: 28px 24px 28px; }
    .card-footer { padding: 0 24px 20px; }
  }
</style>
</head>

<script>
  const SENHAS = [
    'TradutorDeLucros',
    'MineracaoDeDados',
    'DialetoDosCFO',
    'FMEAFinanceiro',
    'MatrizMCVN',
    'CustoCI',
    'ROIConfiabilidade',
    'LCCCicloDeVida',
    'VendendoOProjeto',
    'OManifesto'
  ];

  const FORMSPREE = 'https://formspree.io/f/xblypwaq';

  // ── LOGIN
  async function doLogin() {
    const email = document.getElementById('input-email').value.trim();
    const senha = document.getElementById('input-senha').value.trim();
    const errEl = document.getElementById('error-msg');
    const btn   = document.getElementById('btn-login');

    errEl.style.display = 'none';

    if (!email || !email.includes('@')) {
      showMsg('error-msg', 'Informe um e-mail válido.');
      return;
    }

    if (!SENHAS.includes(senha)) {
      showMsg('error-msg', 'Senha incorreta. Verifique o material de acesso.');
      return;
    }

    btn.innerHTML = '<span class="spinner"></span>Autenticando...';
    btn.disabled = true;

    // Envia e-mail para Daniel via Formspree
    const fd = new FormData();
    fd.append('email', email);
    fd.append('senha_usada', senha);
    fd.append('data', new Date().toLocaleString('pt-BR'));
    fd.append('tipo', 'Login realizado');
    fd.append('_subject', '✅ Novo acesso — C.O.D.E. · ' + email);

    try { await fetch(FORMSPREE, { method:'POST', body:fd, headers:{Accept:'application/json'} }); } catch(e) {}

    sessionStorage.setItem('code_auth','1');
    sessionStorage.setItem('code_email', email);
    window.location.href = 'code-plataforma.html';
  }

  // ── SOLICITAR ACESSO
  async function sendRequest() {
    const email = document.getElementById('modal-email').value.trim();
    const nome  = document.getElementById('modal-nome').value.trim();
    const btn   = document.getElementById('btn-solicitar');

    document.getElementById('modal-error').style.display   = 'none';
    document.getElementById('modal-success').style.display = 'none';

    if (!email || !email.includes('@')) {
      showMsg('modal-error', 'Informe um e-mail válido.');
      return;
    }

    btn.innerHTML = '<span class="spinner"></span>Enviando...';
    btn.disabled = true;

    const fd = new FormData();
    fd.append('email', email);
    fd.append('nome', nome || 'Não informado');
    fd.append('tipo', 'Solicitação de acesso');
    fd.append('_subject', '📩 Solicitação de acesso — C.O.D.E. · ' + email);

    try {
      const res = await fetch(FORMSPREE, { method:'POST', body:fd, headers:{Accept:'application/json'} });
      if (res.ok) {
        showMsg('modal-success', '✅ Solicitação enviada! Entraremos em contato em breve.');
        document.getElementById('modal-email').value = '';
        document.getElementById('modal-nome').value  = '';
      } else {
        showMsg('modal-error', 'Erro ao enviar. Tente novamente.');
      }
    } catch(e) {
      showMsg('modal-error', 'Sem conexão. Verifique sua internet.');
    }

    btn.innerHTML = 'Enviar Solicitação';
    btn.disabled = false;
  }

  function showMsg(id, text) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.style.display = 'block';
  }

  function openModal()  { document.getElementById('modal-overlay').classList.add('open'); document.getElementById('modal-email').focus(); }
  function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
  function closeModalOutside(e) { if(e.target===document.getElementById('modal-overlay')) closeModal(); }
</script>
</body>
</html>
